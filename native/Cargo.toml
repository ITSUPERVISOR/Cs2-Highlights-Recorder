[package]
name = "reel"
version = "0.1.0"
edition = "2021"
description = "Native CS2 clip preview"

[[bin]]
name = "reel"
path = "src/main.rs"

[dependencies]
parser = { path = "vendor/demoparser/src/parser" }
ahash = "0.8"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
winit = "0.30.5"
wgpu = "22"
egui = "0.29"
egui-wgpu = "0.29"
egui-winit = "0.29"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.4"

[profile.dev]
overflow-checks = false

[profile.release]
overflow-checks = false
lto = false
codegen-units = 16
