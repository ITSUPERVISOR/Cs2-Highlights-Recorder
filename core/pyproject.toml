[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2-reel-core"
version = "0.1.0"
description = "CS2 Reel core: parse demos, score personal highlights, record via HLAE"
requires-python = ">=3.11"
dependencies = [
    "demoparser2>=0.42",
    "pandas>=2.0",
    "click>=8.1",
    "rich>=13",
    "psutil>=5.9",
    "vdf>=3.4",
    "tomli-w>=1",
    "requests>=2.31",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reel-core = "reel_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
